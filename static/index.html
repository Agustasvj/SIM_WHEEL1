<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VForce Simulator Mode</title>
  <style>
    :root {
      --bg: #0f172a;
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #00ffcc;
      --primary-hover: #00e6b8;
      --flight: #ff3366;
      --flight-hover: #e62e5c;
    }
    
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 255, 204, 0.15), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(255, 51, 102, 0.15), transparent 25%);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    
    p {
      color: #94a3b8;
      margin-bottom: 3rem;
      font-size: 1.2rem;
    }

    .card-container {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .mode-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 3rem 4rem;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      text-decoration: none;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 250px;
    }

    .mode-card:hover {
      transform: translateY(-5px);
    }

    .mode-card.driving:hover {
      border-color: var(--primary);
      box-shadow: 0 10px 30px rgba(0, 255, 204, 0.2);
    }

    .mode-card.flight:hover {
      border-color: var(--flight);
      box-shadow: 0 10px 30px rgba(255, 51, 102, 0.2);
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }

    .mode-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .driving .mode-title { color: var(--primary); }
    .flight .mode-title { color: var(--flight); }

  </style>
</head>
<body>

  <h1>VForce</h1>
  <p>Select your simulation experience</p>

  <div class="card-container">
    <a href="/Driving" class="mode-card driving">
      <div class="icon">🏎️</div>
      <h2 class="mode-title">Driving</h2>
    </a>
    <a href="/Flight" class="mode-card flight">
      <div class="icon">✈️</div>
      <h2 class="mode-title">Flight</h2>
    </a>
  </div>

</body>
</html>
